<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hubungi Kami - TravelYuk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <div class="logo">Travel<span>Ridho</span></div>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="product.html">Destinasi</a></li>
        <li><a href="about.html">Tentang</a></li>
        <li><a href="contact.html">Kontak</a></li>
    </ul>
</nav>

    <section class="section-padding">
        <div class="container">
            <div style="text-align: center; margin-bottom: 40px;">
                <h2>Hubungi Kami</h2>
                <p style="color: var(--text-muted);">Punya pertanyaan? Kami siap membantu merencanakan liburanmu.</p>
            </div>

            <form class="contact-form">
                <div class="form-group">
                    <label style="display:block; margin-bottom: 8px; font-weight:600;">Nama Lengkap</label>
                    <input type="text" placeholder="Masukkan nama anda..." required>
                </div>
                
                <div class="form-group">
                    <label style="display:block; margin-bottom: 8px; font-weight:600;">Alamat Email</label>
                    <input type="email" placeholder="contoh@email.com" required>
                </div>

                <div class="form-group">
                    <label style="display:block; margin-bottom: 8px; font-weight:600;">Pesan Anda</label>
                    <textarea placeholder="Tuliskan detail pertanyaan atau destinasi yang anda inginkan..." rows="5" required></textarea>
                </div>

                <button type="submit" class="btn-main" style="width: 100%; border-radius: 12px;">Kirim Pesan Sekarang</button>
            </form>
        </div>
    </section>

    <footer>
        <div class="footer-content">
            <p>&copy; 2026 TravelYuk. Project IT Semester 2.</p>
        </div>
    </footer>

</body>
</html>
